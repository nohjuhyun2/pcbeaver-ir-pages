<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PCBeaver 온라인 자료 모음" />
    <title>PCBeaver | 자료 모음</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f8fb;
        --muted: #9aa9b7;
        --night: #071019;
        --panel: #0e1b28;
        --line: rgba(255, 255, 255, 0.14);
        --green: #6ce0a0;
        --blue: #6cbcff;
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 5%, rgba(43, 148, 222, .22), transparent 29%),
          radial-gradient(circle at 10% 98%, rgba(57, 179, 116, .16), transparent 31%),
          var(--night);
        font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main { width: min(100% - 40px, 980px); margin: 0 auto; padding: 88px 0; }
      .brand { margin: 0 0 48px; font-size: 14px; font-weight: 800; letter-spacing: .1em; }
      .brand span { color: var(--green); }
      .eyebrow { margin: 0 0 14px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .12em; }
      h1 { max-width: 680px; margin: 0; font-size: clamp(36px, 6vw, 62px); line-height: 1.08; letter-spacing: -.045em; }
      .intro { max-width: 560px; margin: 20px 0 52px; color: var(--muted); font-size: 17px; line-height: 1.7; }
      .section-title { margin: 0 0 14px; font-size: 15px; color: var(--muted); font-weight: 650; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
      .card {
        display: flex; flex-direction: column; min-height: 225px; padding: 26px;
        color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 18px;
        background: rgba(14, 27, 40, .8); transition: transform .2s ease, border-color .2s ease, background .2s ease;
      }
      .card:hover, .card:focus-visible { transform: translateY(-4px); border-color: var(--green); background: rgba(18, 40, 57, .95); outline: none; }
      .tag { width: fit-content; padding: 5px 9px; border-radius: 999px; background: rgba(108, 224, 160, .12); color: var(--green); font-size: 12px; font-weight: 700; }
      h2 { margin: 28px 0 10px; font-size: 25px; letter-spacing: -.03em; }
      .card p { margin: 0; color: var(--muted); line-height: 1.6; }
      .open { margin-top: auto; padding-top: 28px; color: var(--blue); font-size: 14px; font-weight: 750; }
      footer { margin-top: 64px; color: var(--muted); font-size: 13px; }
      code { color: var(--ink); }
      @media (max-width: 600px) { main { width: min(100% - 32px, 980px); padding: 48px 0; } .brand { margin-bottom: 36px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">PC<span>BEAVER</span></p>
      <p class="eyebrow">ONLINE MATERIALS</p>
      <h1>PCBeaver 자료 모음</h1>
      <p class="intro">공유 가능한 발표 자료와 문서를 한곳에서 확인하세요. 각 카드를 선택하면 해당 HTML 페이지가 열립니다.</p>

      <section aria-labelledby="materials-title">
        <h2 class="section-title" id="materials-title">현재 자료</h2>
        <div class="grid">
          <a class="card" href="./pcbeaver_ir_60s.html">
            <span class="tag">IR</span>
            <h2>60초 IR</h2>
            <p>PCBeaver의 핵심 가치와 사업 내용을 60초 안에 소개하는 인터랙티브 발표 자료입니다.</p>
            <span class="open">자료 열기 →</span>
          </a>
        </div>
      </section>

      <footer>새 자료를 추가할 때는 HTML 파일을 업로드한 뒤 이 목록에 카드 링크를 추가하세요.</footer>
    </main>
  </body>
</html>
